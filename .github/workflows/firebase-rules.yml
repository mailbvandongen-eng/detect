name: Publiceer Firestore-regels

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/firebase-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detect-firestore-rules
  cancel-in-progress: true

jobs:
  deploy-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: Node installeren
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Firestore-regels direct publiceren
        env:
          FIREBASE_SERVICE_ACCOUNT_DETECT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DETECT }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const crypto = require('crypto')

          const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_DETECT || '{}')
          const project = credentials.project_id
          const clientEmail = credentials.client_email
          const privateKey = credentials.private_key

          if (!project || !clientEmail || !privateKey) {
            throw new Error('GitHub secret FIREBASE_SERVICE_ACCOUNT_DETECT is onvolledig.')
          }

          const b64url = value => Buffer.from(value).toString('base64url')
          const now = Math.floor(Date.now() / 1000)
          const header = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }))
          const payload = b64url(JSON.stringify({
            iss: clientEmail,
            scope: 'https://www.googleapis.com/auth/firebase',
            aud: 'https://oauth2.googleapis.com/token',
            iat: now,
            exp: now + 3600
          }))
          const unsigned = `${header}.${payload}`
          const signature = crypto.sign('RSA-SHA256', Buffer.from(unsigned), privateKey).toString('base64url')
          const assertion = `${unsigned}.${signature}`

          const tokenResponse = await fetch('https://oauth2.googleapis.com/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
              assertion
            })
          })
          const tokenBody = await tokenResponse.json()
          if (!tokenResponse.ok || !tokenBody.access_token) {
            throw new Error(`OAuth token ophalen mislukt: ${JSON.stringify(tokenBody)}`)
          }

          const headers = {
            Authorization: `Bearer ${tokenBody.access_token}`,
            'Content-Type': 'application/json'
          }

          async function api(url, options = {}) {
            const response = await fetch(url, { ...options, headers: { ...headers, ...(options.headers || {}) } })
            const text = await response.text()
            let body = null
            try { body = text ? JSON.parse(text) : null } catch { body = text }
            if (!response.ok) {
              throw new Error(`${options.method || 'GET'} ${url} -> ${response.status}: ${typeof body === 'string' ? body : JSON.stringify(body)}`)
            }
            return body
          }

          const rules = fs.readFileSync('firestore.rules', 'utf8')
          const ruleset = await api(
            `https://firebaserules.googleapis.com/v1/projects/${project}/rulesets`,
            {
              method: 'POST',
              body: JSON.stringify({
                source: { files: [{ name: 'firestore.rules', content: rules }] }
              })
            }
          )

          const releaseName = `projects/${project}/releases/cloud.firestore`
          const releaseUrl = `https://firebaserules.googleapis.com/v1/${releaseName}`
          const probe = await fetch(releaseUrl, { headers })

          if (probe.status === 404) {
            await api(
              `https://firebaserules.googleapis.com/v1/projects/${project}/releases`,
              {
                method: 'POST',
                body: JSON.stringify({ name: releaseName, rulesetName: ruleset.name })
              }
            )
          } else if (probe.ok) {
            await api(releaseUrl, {
              method: 'PATCH',
              body: JSON.stringify({
                release: { name: releaseName, rulesetName: ruleset.name },
                updateMask: 'rulesetName'
              })
            })
          } else {
            throw new Error(`Release controleren mislukt: ${probe.status} ${await probe.text()}`)
          }

          console.log(`Firestore-regels gepubliceerd: ${ruleset.name}`)
          NODE
