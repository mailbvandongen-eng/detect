name: Test buddy-flow
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-buddy-rules.yml', 'scripts/test-buddy-flow.mjs', 'scripts/test-buddy-ui.mjs', 'src/hooks/useBuddyLayers.ts', 'src/utils/buddyLayerState.ts', 'src/utils/userLayerCatalog.ts', 'src/store/buddySyncStore.ts', 'src/components/CustomPoints/CreateLayerModal.tsx', 'src/hooks/useCloudSync.ts', 'src/services/buddyLayers.ts', 'firestore.rules']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-buddy-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installeer testgereedschap
        run: npm install --prefix "$RUNNER_TEMP/buddy-test" --no-audit --no-fund typescript@5.9.3 firebase@12.7.0 @firebase/rules-unit-testing firebase-tools
      - name: Test laagweergave en herstel van cloudverbinding
        env:
          BUDDY_TEST_MODULE_ROOT: ${{ runner.temp }}/buddy-test
        run: node scripts/test-buddy-ui.mjs
      - name: Test echte appfuncties tegen Firebase-emulator
        env:
          BUDDY_TEST_MODULE_ROOT: ${{ runner.temp }}/buddy-test
        run: |
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"port":8080},"ui":{"enabled":false}}}' > "$RUNNER_TEMP/buddy-config.json"
          cp firestore.rules "$RUNNER_TEMP/firestore.rules"
          "$RUNNER_TEMP/buddy-test/node_modules/.bin/firebase" emulators:exec --only firestore --project demo-detect-flow --config "$RUNNER_TEMP/buddy-config.json" "node scripts/test-buddy-flow.mjs"
