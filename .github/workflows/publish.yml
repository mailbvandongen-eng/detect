name: Publiceer Detect

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: detect-pages
  cancel-in-progress: true

jobs:
  verify-private-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Installeer Firebase-testgereedschap
        run: npm install --prefix "$RUNNER_TEMP/private-sync" --no-audit --no-fund firebase@12.7.0 @firebase/rules-unit-testing@5.0.2 firebase-tools@14.12.0 playwright@1.62.1
      - name: Controleer gegevensbehoud en accounts tegen echte Firestore-emulator
        env:
          PRIVATE_SYNC_TEST_MODULE_ROOT: ${{ runner.temp }}/private-sync
        run: |
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"port":8080},"ui":{"enabled":false}}}' > "$RUNNER_TEMP/private-sync/firebase.json"
          cp firestore.rules "$RUNNER_TEMP/private-sync/firestore.rules"
          "$RUNNER_TEMP/private-sync/node_modules/.bin/firebase" emulators:exec --only firestore --project demo-private-data --config "$RUNNER_TEMP/private-sync/firebase.json" "node scripts/test-private-sync-emulator.mjs"
      - name: Controleer gelijktijdige gedeelde bewerkingen en rechten
        env:
          BUDDY_TEST_MODULE_ROOT: ${{ runner.temp }}/private-sync
        run: '"$RUNNER_TEMP/private-sync/node_modules/.bin/firebase" emulators:exec --only firestore --project demo-detect-flow --config "$RUNNER_TEMP/private-sync/firebase.json" "node scripts/test-buddy-flow.mjs"'
      - name: Installeer WebKit voor mobiel testen
        run: '"$RUNNER_TEMP/private-sync/node_modules/.bin/playwright" install --with-deps webkit'
      - name: Controleer delen en accountwisseling op iPhone-formaat
        env:
          BUDDY_BROWSER_MODULE_ROOT: ${{ runner.temp }}/private-sync
        run: |
          node scripts/test-buddy-sharing-browser.mjs
          node scripts/test-app-maintenance-browser.mjs
          node scripts/test-buddy-writes-browser.mjs
          node scripts/test-prio-three-browser.mjs
          node scripts/test-radar-browser.mjs
          node scripts/test-place-list-browser.mjs
  build:
    needs: verify-private-data
    runs-on: ubuntu-latest

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: Node installeren
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Controleer types en regressies
        run: |
          npm run typecheck
          npm run test:app-maintenance
          npm run test:private-sync
          npm run test:field
          npm run test:user-layers
          npm run test:controls
          npm run test:place-list
          npm run test:thedirac-research
          npm run test:buddy-ui
          npm run test:buddy-writes

      - name: Productieversie bouwen
        run: npm run build

      - name: GitHub Pages-bestanden publiceren
        run: |
          if git diff --quiet -- docs; then
            echo "Geen wijzigingen in de publicatie."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "build: publiceer Detect ${GITHUB_SHA::7} [skip ci]"
          git push
